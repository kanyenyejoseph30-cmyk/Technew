<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background with gold border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
  
  <!-- Crown / Diamond Luxe Icon -->
  <g transform="translate(106, 110) scale(1.18)">
    <!-- Stylized Crown & B monogram -->
    <path d="M128 32 L160 88 L216 48 L196 140 L60 140 L40 48 L96 88 Z" fill="url(#goldGrad)" />
    <!-- Letter B & E intertwined -->
    <text x="128" y="210" font-family="Playfair Display, Georgia, serif" font-size="78" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="4">B É</text>
    <text x="128" y="235" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#d97706" letter-spacing="8">BLANCHE ÉLÉGANCE</text>
  </g>
</svg>
